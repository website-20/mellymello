    <noscript><link rel="stylesheet" href="assets/css/styles.css"></noscript>

    <!-- Schema.org structured data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",

        "description": "Restaurant proposant une cuisine togolaise authentique et raffinée",

        "openingHours": [

        ],

        "priceRange": "$$"
    }
    </script>
</head>
<body>
    <!-- Navigation principale -->
    <header id="main-header">
        <nav class="container">
            <div class="logo">
                <img src="assets/images/log.jpg" alt="Melly Mello Logo" width="120" height="60">
            </div>
            <button class="hamburger" aria-label="Menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="#accueil" data-nav-link>Accueil</a></li>
                <li><a href="#apropos" data-nav-link>À Propos</a></li>
                <li><a href="#menu" data-nav-link>Menu</a></li>
                <li><a href="#boutique" data-nav-link>Boutique</a></li>
                <li><a href="#galerie" data-nav-link>Galerie</a></li>
                <li><a href="#video" data-nav-link>Vidéo</a></li>
                <li><a href="#commande" data-nav-link>Commander</a></li>
                <li><a href="#localisation" data-nav-link>Localisation</a></li>
                <li><a href="#contact" data-nav-link>Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenu principal -->
    <main>
        <!-- Section Hero -->
        <section id="accueil" class="hero" data-section>
            <div class="container">
                <div class="hero-content">
                    <h1>Melly Mello</h1>
                    <p>Une expérience culinaire exceptionnelle au cœur de Lomé</p>
                    <div class="hero-buttons">
                        <a href="#menu" class="cta-button">Découvrir notre Menu</a>
                        <a href="#commande" class="cta-button whatsapp-btn">Commander en Ligne</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Les autres sections seront générées dynamiquement par JavaScript -->
        <div id="dynamic-content"></div>
    </main>

    <!-- Composants UI réutilisables -->
    
    <!-- Panier -->
    <aside class="cart-sidebar" id="cartSidebar" aria-hidden="true">
        <div class="cart-header">
            <h3>Votre Panier</h3>
            <button class="close-cart" id="closeCart" aria-label="Fermer le panier">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <!-- Contenu généré dynamiquement -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                Total: <span id="cartTotal">0</span> FCFA
            </div>
            <button class="checkout-btn" id="checkoutBtn">Commander via WhatsApp</button>
        </div>
    </aside>
    <div class="cart-overlay" id="cartOverlay" aria-hidden="true"></div>

    <!-- Boutons flottants -->
    <a href="https://wa.me/22893999667?text=Bonjour%20Melly%20Mello,%20je%20voudrais%20passer%20une%20commande" 
       class="floating-whatsapp" 
       target="_blank" 
       rel="noopener"
       aria-label="Contactez-nous sur WhatsApp">
        <i class="fab fa-whatsapp" aria-hidden="true"></i>
    </a>

    <button class="cart-icon" id="cartIcon" aria-label="Ouvrir le panier">
        <i class="fas fa-shopping-cart" aria-hidden="true"></i>
        <span class="cart-count">0</span>
    </button>

    <!-- Loading Spinner -->
    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
    </div>

    <!-- Footer -->
    <footer id="main-footer">
        <!-- Contenu généré dynamiquement -->
    </footer>

    <!-- Scripts optimisés -->
    <script src="assets/js/data.js" defer></script>
    <script src="assets/js/components.js" defer></script>
    <script src="assets/js/main.js" defer></script>
    
    <!-- Service Worker pour le caching (optionnel) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => console.log('SW registered'))
                    .catch(err => console.log('SW registration failed'));
            });
        }
    </script>
</body>
</html>
